<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 32px; background: #f0f4ff; font-family: "Microsoft YaHei", sans-serif; color: #1a2744; }
    .card { max-width: 560px; margin: auto; padding: 28px; border-radius: 28px; background: linear-gradient(135deg, #ffffff, #e8f0ff); box-shadow: 0 18px 48px rgba(40, 80, 180, .15); }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .subtitle { margin: 0 0 24px; color: #4a5a7a; font-size: 14px; }
    .device-card { margin-bottom: 20px; padding: 18px; border-radius: 18px; background: rgba(255,255,255,.7); border: 1px solid rgba(60, 100, 200, .12); }
    .device-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .device-icon { font-size: 28px; width: 36px; text-align: center; }
    .device-name { font-size: 18px; font-weight: 700; color: #1a2744; flex: 1; }
    .status-online { font-size: 13px; padding: 3px 12px; border-radius: 20px; background: #e6f7e6; color: #1a7a1a; font-weight: 600; }
    .status-offline { font-size: 13px; padding: 3px 12px; border-radius: 20px; background: #f5e6e6; color: #aa3333; font-weight: 600; }
    .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,.04); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-size: 13px; color: #5a6a8a; }
    .detail-value { font-size: 13px; color: #1a2744; font-weight: 500; text-align: right; max-width: 60%; }
    .footer { margin-top: 8px; text-align: center; font-size: 12px; color: #7a8aaa; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📡 实时设备状态</h1>
    <p class="subtitle">电脑 · 手机 · 平板</p>
    $device_slots
    <div class="footer">数据来源：aionflux.cn</div>
  </main>
</body>
</html>
