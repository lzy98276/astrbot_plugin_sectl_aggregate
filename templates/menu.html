<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 32px; background: #f4f0ff; font-family: "Microsoft YaHei", sans-serif; color: #2d2142; }
    .card { max-width: 760px; margin: auto; padding: 32px; border-radius: 28px; background: linear-gradient(135deg, #ffffff, #eee7ff); box-shadow: 0 18px 48px rgba(90, 56, 160, .18); }
    h1 { margin: 0 0 8px; font-size: 34px; }
    p { margin: 0 0 24px; color: #6b5d83; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    li { padding: 16px 18px; border-radius: 18px; background: rgba(255, 255, 255, .76); border: 1px solid rgba(124, 92, 190, .16); }
    strong { display: block; font-size: 18px; color: #54309c; margin-bottom: 6px; }
    span { color: #544a66; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📣 回声洞</h1>
    <p>匿名回声、温柔回应。写操作需要先完成 QQ 绑定。</p>
    <ul>$commands</ul>
  </main>
</body>
</html>
