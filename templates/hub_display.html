<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 30px; background: #fef7ee; font-family: "Microsoft YaHei", sans-serif; color: #3d2a1f; }
    .hub { max-width: 720px; margin: auto; padding: 34px; border-radius: 28px; background: linear-gradient(145deg, #ffffff, #fff5e8); box-shadow: 0 16px 42px rgba(166, 106, 43, .17); }
    .tag { display: inline-block; padding: 7px 14px; border-radius: 999px; background: #ffedd5; color: #a65513; font-weight: 700; }
    .title { margin: 20px 0 12px; font-size: 26px; font-weight: 700; line-height: 1.4; }
    .desc { margin: 0 0 16px; font-size: 18px; line-height: 1.72; color: #4a3a2a; }
    .meta { color: #75897a; font-size: 15px; display: flex; gap: 18px; flex-wrap: wrap; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tag-item { padding: 4px 12px; border-radius: 999px; background: #e8e0ff; color: #5a3ca6; font-size: 13px; }
  </style>
</head>
<body>
  <article class="hub">
    <div class="tag">Hub #$hub_id</div>
    <div class="title">$title</div>
    <div class="desc">$description</div>
    <div class="tags">$tags_html</div>
    <div class="meta">
      <span>发布者：$author</span>
      <span>$created_at</span>
      <span>👁 $views</span>
    </div>
  </article>
</body>
</html>
